<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Forms</title>
	</head>
	<body>
		<!-- Netlify Forms detection skeleton for the contact form in src/app/components/sections/Contact.tsx. Keep the field names in sync. -->
		<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
			<input type="hidden" name="form-name" value="contact" />
			<input name="bot-field" />
			<input name="name" />
			<input name="email" type="email" />
			<textarea name="message"></textarea>
		</form>
	</body>
</html>
